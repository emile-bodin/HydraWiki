services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  api:
    build: ./backend
    environment:
      HYDRAWIKI_DATABASE_URL: "${HYDRAWIKI_DATABASE_URL:?HYDRAWIKI_DATABASE_URL must be set externally}"
      HYDRAWIKI_QDRANT_URL: "${HYDRAWIKI_QDRANT_URL:-http://qdrant:6333}"
      HYDRAWIKI_LOCAL_REPOSITORIES_ROOT: /repositories
      HYDRAWIKI_WORKSPACE_ROOT: /var/lib/hydrawiki/workspaces
    volumes:
      - "${LOCAL_REPOSITORIES_ROOT:-./repositories}:/repositories:ro"
      - workspace-data:/var/lib/hydrawiki/workspaces
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: ./backend
    command: ["python", "-m", "hydrawiki.worker"]
    environment:
      HYDRAWIKI_DATABASE_URL: "${HYDRAWIKI_DATABASE_URL:?HYDRAWIKI_DATABASE_URL must be set externally}"
      HYDRAWIKI_QDRANT_URL: "${HYDRAWIKI_QDRANT_URL:-http://qdrant:6333}"
      HYDRAWIKI_LOCAL_REPOSITORIES_ROOT: /repositories
      HYDRAWIKI_WORKSPACE_ROOT: /var/lib/hydrawiki/workspaces
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - "${LOCAL_REPOSITORIES_ROOT:-./repositories}:/repositories:ro"
      - workspace-data:/var/lib/hydrawiki/workspaces

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hydrawiki
      POSTGRES_USER: hydrawiki
      POSTGRES_PASSWORD: "${HYDRAWIKI_POSTGRES_PASSWORD:?HYDRAWIKI_POSTGRES_PASSWORD must be set externally}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydrawiki -d hydrawiki"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.13.6
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  qdrant-data:
  workspace-data:
