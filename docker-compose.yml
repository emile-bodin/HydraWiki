services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  api:
    build: ./backend
    environment:
      HYDRAWIKI_DATABASE_URL: "${HYDRAWIKI_DATABASE_URL:?HYDRAWIKI_DATABASE_URL must be set externally}"
      HYDRAWIKI_QDRANT_URL: "${HYDRAWIKI_QDRANT_URL:-http://qdrant:6333}"
      HYDRAWIKI_OLLAMA_URL: "${HYDRAWIKI_OLLAMA_URL:-http://ollama:11434}"
      HYDRAWIKI_EMBEDDING_MODEL: "${HYDRAWIKI_EMBEDDING_MODEL:-nomic-embed-text:latest}"
      HYDRAWIKI_EMBEDDING_INDEX_VERSION: "${HYDRAWIKI_EMBEDDING_INDEX_VERSION:-embedding-v1}"
      HYDRAWIKI_EMBEDDING_MAX_INPUT_CHARACTERS: "${HYDRAWIKI_EMBEDDING_MAX_INPUT_CHARACTERS:-4000}"
      HYDRAWIKI_MAX_REPOSITORY_SIZE_BYTES: "${HYDRAWIKI_MAX_REPOSITORY_SIZE_BYTES-1073741824}"
      HYDRAWIKI_MAX_SOURCE_FILES: "${HYDRAWIKI_MAX_SOURCE_FILES-25000}"
      HYDRAWIKI_EMBEDDING_MAX_CONCURRENCY: "${HYDRAWIKI_EMBEDDING_MAX_CONCURRENCY-2}"
      HYDRAWIKI_INGEST_MAX_CONCURRENCY: "${HYDRAWIKI_INGEST_MAX_CONCURRENCY-1}"
      HYDRAWIKI_GENERATION_MAX_CONCURRENCY: "${HYDRAWIKI_GENERATION_MAX_CONCURRENCY-1}"
      HYDRAWIKI_GENERATION_URL: "${HYDRAWIKI_GENERATION_URL:-}"
      HYDRAWIKI_GENERATION_MODEL: "${HYDRAWIKI_GENERATION_MODEL:-}"
      HYDRAWIKI_GENERATION_API_KEY: "${HYDRAWIKI_GENERATION_API_KEY:-}"
      HYDRAWIKI_GENERATION_TIMEOUT_SECONDS: "${HYDRAWIKI_GENERATION_TIMEOUT_SECONDS:-60}"
      HYDRAWIKI_GENERATION_PROMPT_VERSION: "${HYDRAWIKI_GENERATION_PROMPT_VERSION:-wiki-v1}"
      HYDRAWIKI_GENERATION_MAX_OUTPUT_TOKENS: "${HYDRAWIKI_GENERATION_MAX_OUTPUT_TOKENS:-8000}"
      HYDRAWIKI_GENERATION_MAX_SOURCE_CHARACTERS: "${HYDRAWIKI_GENERATION_MAX_SOURCE_CHARACTERS:-100000}"
      HYDRAWIKI_MERMAID_RENDERER_COMMAND: "${HYDRAWIKI_MERMAID_RENDERER_COMMAND:-mmdc}"
      HYDRAWIKI_MERMAID_TIMEOUT_SECONDS: "${HYDRAWIKI_MERMAID_TIMEOUT_SECONDS:-15}"
      HYDRAWIKI_MERMAID_RENDERER_USER: "${HYDRAWIKI_MERMAID_RENDERER_USER:-hydrawiki-renderer}"
      HYDRAWIKI_LOCAL_REPOSITORIES_ROOT: /repositories
      HYDRAWIKI_WORKSPACE_ROOT: /var/lib/hydrawiki/workspaces
    volumes:
      - "${LOCAL_REPOSITORIES_ROOT:-./repositories}:/repositories:ro"
      - workspace-data:/var/lib/hydrawiki/workspaces
    ports:
      - "${HYDRAWIKI_API_PORT:-8191}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: ./backend
    command: ["python", "-m", "hydrawiki.worker"]
    environment:
      HYDRAWIKI_DATABASE_URL: "${HYDRAWIKI_DATABASE_URL:?HYDRAWIKI_DATABASE_URL must be set externally}"
      HYDRAWIKI_QDRANT_URL: "${HYDRAWIKI_QDRANT_URL:-http://qdrant:6333}"
      HYDRAWIKI_OLLAMA_URL: "${HYDRAWIKI_OLLAMA_URL:-http://ollama:11434}"
      HYDRAWIKI_EMBEDDING_MODEL: "${HYDRAWIKI_EMBEDDING_MODEL:-nomic-embed-text:latest}"
      HYDRAWIKI_EMBEDDING_INDEX_VERSION: "${HYDRAWIKI_EMBEDDING_INDEX_VERSION:-embedding-v1}"
      HYDRAWIKI_EMBEDDING_MAX_INPUT_CHARACTERS: "${HYDRAWIKI_EMBEDDING_MAX_INPUT_CHARACTERS:-4000}"
      HYDRAWIKI_INGEST_MAX_CONCURRENCY: "${HYDRAWIKI_INGEST_MAX_CONCURRENCY-1}"
      HYDRAWIKI_GENERATION_URL: "${HYDRAWIKI_GENERATION_URL:-}"
      HYDRAWIKI_GENERATION_MODEL: "${HYDRAWIKI_GENERATION_MODEL:-}"
      HYDRAWIKI_GENERATION_API_KEY: "${HYDRAWIKI_GENERATION_API_KEY:-}"
      HYDRAWIKI_GENERATION_TIMEOUT_SECONDS: "${HYDRAWIKI_GENERATION_TIMEOUT_SECONDS:-60}"
      HYDRAWIKI_GENERATION_PROMPT_VERSION: "${HYDRAWIKI_GENERATION_PROMPT_VERSION:-wiki-v1}"
      HYDRAWIKI_GENERATION_MAX_OUTPUT_TOKENS: "${HYDRAWIKI_GENERATION_MAX_OUTPUT_TOKENS:-8000}"
      HYDRAWIKI_GENERATION_MAX_SOURCE_CHARACTERS: "${HYDRAWIKI_GENERATION_MAX_SOURCE_CHARACTERS:-100000}"
      HYDRAWIKI_MERMAID_RENDERER_COMMAND: "${HYDRAWIKI_MERMAID_RENDERER_COMMAND:-mmdc}"
      HYDRAWIKI_MERMAID_TIMEOUT_SECONDS: "${HYDRAWIKI_MERMAID_TIMEOUT_SECONDS:-15}"
      HYDRAWIKI_MERMAID_RENDERER_USER: "${HYDRAWIKI_MERMAID_RENDERER_USER:-hydrawiki-renderer}"
      HYDRAWIKI_LOCAL_REPOSITORIES_ROOT: /repositories
      HYDRAWIKI_WORKSPACE_ROOT: /var/lib/hydrawiki/workspaces
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - "${LOCAL_REPOSITORIES_ROOT:-./repositories}:/repositories:ro"
      - workspace-data:/var/lib/hydrawiki/workspaces

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hydrawiki
      POSTGRES_USER: hydrawiki
      POSTGRES_PASSWORD: "${HYDRAWIKI_POSTGRES_PASSWORD:?HYDRAWIKI_POSTGRES_PASSWORD must be set externally}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydrawiki -d hydrawiki"]
      interval: 5s
      timeout: 5s
      retries: 5

  schema:
    build: ./backend
    profiles: ["bootstrap"]
    command: ["python", "-m", "hydrawiki.operational", "bootstrap"]
    environment:
      HYDRAWIKI_DATABASE_URL: "${HYDRAWIKI_DATABASE_URL:?HYDRAWIKI_DATABASE_URL must be set externally}"
      HYDRAWIKI_QDRANT_URL: "${HYDRAWIKI_QDRANT_URL:-http://qdrant:6333}"
    depends_on:
      postgres:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.13.6
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  qdrant-data:
  workspace-data:
